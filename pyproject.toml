[project]
name = "sst-seguridad-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2wsgi>=1.10.10",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pyinstaller>=6.22.3",
    "pyjwt>=2.15.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sst-seguridad-app = "sst_seguridad_app:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

